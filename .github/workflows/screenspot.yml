name: laya-screenspot-grounding
on:
  workflow_dispatch:
    inputs:
      n: {description: "samples", default: "200"}
      tag: {description: "result tag", default: "ss"}
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install "transformers>=4.48.0" datasets pillow numpy matplotlib accelerate
      - run: python screenspot_cpu.py 2>&1 | tee screenspot_log.txt
        env:
          SS_N: ${{ inputs.n }}
          TAG: ${{ inputs.tag }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenspot
          path: |
            screenspot_log.txt
            screenspot_results_*.json
            screenspot_results_*.png
      - name: commit results
        if: success()
        run: |
          mkdir -p results && cp screenspot_results_* results/ && cp screenspot_log.txt results/screenspot_log_${{ inputs.tag }}.txt
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          git add results && git commit -m "ScreenSpot grounding (ShowUI-2B, CPU): real results from Actions run" && git pull --rebase origin main && git push
