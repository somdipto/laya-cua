name: laya-pipeline-small
on:
  workflow_dispatch:
    inputs:
      n_train: {description: "laya train rows", default: "900"}
      pipe_n: {description: "pipeline eval steps", default: "100"}
      tag: {description: "result tag", default: "pipe"}
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: pip install "laya>=0.1.6" "transformers>=4.48.0" safetensors huggingface_hub numpy scipy pandas matplotlib accelerate datasets pillow
      - run: set -o pipefail; python pipeline_train.py 2>&1 | tee pipeline_log.txt
        env:
          N_TRAIN: ${{ inputs.n_train }}
          BALANCED: "1"
          SKIP_ZS: "1"
          EVAL_N: "1"
      - run: set -o pipefail; python pipeline_eval.py 2>&1 | tee -a pipeline_log.txt
        env:
          N_TRAIN: ${{ inputs.n_train }}
          PIPE_N: ${{ inputs.pipe_n }}
          TAG: ${{ inputs.tag }}
          BALANCED: "1"
          SKIP_ZS: "1"
          EVAL_N: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pipeline
          path: |
            pipeline_log.txt
            pipeline_results_*.json
            pipeline_results_*.png
      - name: commit results
        if: success()
        run: |
          mkdir -p results && cp pipeline_results_* results/ && cp pipeline_log.txt results/pipeline_log_${{ inputs.tag }}.txt
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          git add results && git commit -m "Small pipeline test (Laya + ShowUI-2B, CPU): real results from Actions run" && git pull --rebase origin main && git push
